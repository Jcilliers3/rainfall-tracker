   # Sends the database changes and Edge Functions to Supabase on every push to
   # main that touches the supabase folder. Netlify builds the website separately.
   name: Deploy Supabase

   on:
     push:
       branches: [main]
       paths: ['supabase/**', '.github/workflows/deploy-supabase.yml']
     workflow_dispatch:

   jobs:
     deploy:
       runs-on: ubuntu-latest
       env:
         SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
         SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
         PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
       steps:
         - uses: actions/checkout@v4
         - uses: supabase/setup-cli@v1
           with:
             version: latest
         - run: supabase link --project-ref "$PROJECT_ID"
         - run: supabase db push
         - run: supabase functions deploy --project-ref "$PROJECT_ID"
         - name: Set function secrets
           env:
             YR_USER_AGENT: ${{ secrets.YR_USER_AGENT }}
             CRON_SECRET: ${{ secrets.CRON_SECRET }}
             ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
           run: |
             supabase secrets set --project-ref "$PROJECT_ID" \
               "YR_USER_AGENT=$YR_USER_AGENT" \
               "CRON_SECRET=$CRON_SECRET" \
               "ADMIN_KEY=$ADMIN_KEY"
